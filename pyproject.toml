[project]
name = "llm-integrations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "google-genai>=3.1.0",
    "openai-agents>=0.24.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "validators>=0.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
